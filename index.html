<script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyUTz-A1b6Q2QUZsU_uJC023IWgscqp2Ga-U2WxoORnQuYlLDvebCfIFlYjZBTfb2Ddiw/exec";
        let cacheProveedores = []; 
        let chartsCargados = false; // Bandera de seguridad para el estado de Google Charts

        // Forzar la carga de Google Charts de manera segura
        try {
            google.charts.load('current', {'packages':['corechart', 'bar']});
            google.charts.setOnLoadCallback(() => {
                chartsCargados = true;
                cargarDatos(); // Ejecutar la primera carga de datos una vez que los gráficos estén listos
            });
        } catch (e) {
            console.error("Error al inicializar Google Charts:", e);
            // Si falla la librería externa, intentamos cargar los datos numéricos de todos modos
            window.onload = cargarDatos;
        }

        async function cargarDatos() {
            try {
                // Colocar textos de carga por si es una actualización
                document.getElementById('chart-progreso').innerText = "Cargando gráficos...";
                document.getElementById('chart-distribucion').innerText = "Procesando existencias...";

                const response = await fetch(WEB_APP_URL);
                const resultado = await response.json();
                if (resultado.status === "success") {
                    cacheProveedores = resultado.data.proveedores || [];
                    renderizarDashboard(resultado.data);
                    actualizarInterfacesProveedores();
                } else {
                    console.error("El backend no devolvió un estatus de éxito:", resultado);
                }
            } catch (error) { 
                console.error("Error crítico cargando datos desde Google Sheets:", error); 
            }
        }

        function actualizarInterfacesProveedores() {
            const selects = document.querySelectorAll('.select-proveedores');
            selects.forEach(sel => {
                sel.innerHTML = '<option value="">-- Seleccione un proveedor --</option>';
                cacheProveedores.forEach(p => { 
                    sel.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`; 
                });
            });

            const listaDom = document.getElementById('lista-proveedores-completa');
            if (listaDom) {
                listaDom.innerHTML = "";
                cacheProveedores.forEach(p => {
                    const productosLista = Array.isArray(p.productos) ? p.productos : [];
                    const chips = productosLista.map(prod => `<span class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full">${prod}</span>`).join(' ');
                    
                    listaDom.innerHTML += `
                        <div class="p-3 bg-gray-50 border rounded-lg">
                            <p class="font-bold text-sm text-gray-800">${p.nombre}</p>
                            <div class="flex flex-wrap gap-1 mt-1.5">${chips ? chips : '<span class="text-xs text-gray-400 italic">Sin mercancías</span>'}</div>
                        </div>`;
                });
            }
        }

        function filtrarProductosPorProveedor(nombreProveedor, idSelectDestino) {
            const selectDestino = document.getElementById(idSelectDestino);
            selectDestino.innerHTML = "";
            
            if (!nombreProveedor) {
                selectDestino.innerHTML = '<option value="">-- Seleccione primero un proveedor --</option>';
                return;
            }

            const proveedorEncontrado = cacheProveedores.find(p => p.nombre === nombreProveedor);
            
            if (proveedorEncontrado && proveedorEncontrado.productos && Array.isArray(proveedorEncontrado.productos)) {
                const productosLista = proveedorEncontrado.productos;

                if (productosLista.length > 0) {
                    selectDestino.innerHTML = '<option value="">-- Seleccione Mercancía --</option>';
                    productosLista.forEach(prod => {
                        selectDestino.innerHTML += `<option value="${prod}">${prod}</option>`;
                    });
                } else {
                    selectDestino.innerHTML = '<option value="">⚠️ Sin mercancía registrada</option>';
                }
            } else {
                selectDestino.innerHTML = '<option value="">⚠️ Sin mercancía registrada</option>';
            }
        }

        function renderizarDashboard(data) {
            let totalPrepagado = 0, totalPendiente = 0, totalRecibido = 0;
            const tbody = document.getElementById("tabla-lotes"); 
            tbody.innerHTML = "";
            
            if (!data.detallesLotes || data.detallesLotes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-xs text-gray-400 italic">No hay lotes activos registrados</td></tr>`;
                document.getElementById("kpi-prepagado").innerText = "0";
                document.getElementById("kpi-recibido").innerText = "0";
                document.getElementById("kpi-pendiente").innerText = "0";
                return;
            }

            data.detallesLotes.forEach(lote => {
                const recibido = lote.cantOriginal - lote.cantDisponible;
                totalPrepagado += lote.cantOriginal; totalPendiente += lote.cantDisponible; totalRecibido += recibido;
                tbody.insertAdjacentHTML("beforeend", `
                    <tr class="hover:bg-gray-50 transition border-b">
                        <td class="px-6 py-4 font-semibold">${lote.idLote}</td>
                        <td class="px-6 py-4">${lote.proveedor}</td>
                        <td class="px-6 py-4">${lote.producto}</td>
                        <td class="px-6 py-4 text-right font-mono">${lote.cantOriginal.toLocaleString()}</td>
                        <td class="px-6 py-4 text-right font-mono font-bold text-amber-600">${lote.cantDisponible.toLocaleString()}</td>
                    </tr>`);
            });

            // Asignar los KPIs numéricos primero de manera segura
            document.getElementById("kpi-prepagado").innerText = totalPrepagado.toLocaleString();
            document.getElementById("kpi-recibido").innerText = totalRecibido.toLocaleString();
            document.getElementById("kpi-pendiente").innerText = totalPendiente.toLocaleString();
            
            // Dibujar gráficos sólo si la librería ya cargó por completo
            if (chartsCargados && data.resumenConsolidated && data.resumenConsolidated.length > 0) {
                dibujarGraficos(data.resumenConsolidated);
            } else if (!chartsCargados) {
                console.warn("Los datos llegaron pero Google Charts aún no termina de cargar.");
            }
        }

        function dibujarGraficos(resumen) {
            try {
                const dataProgreso = new google.visualization.DataTable();
                dataProgreso.addColumn('string', 'Proveedor'); 
                dataProgreso.addColumn('number', 'Recibido'); 
                dataProgreso.addColumn('number', 'Pendiente');
                
                const dataTorta = [['Proveedor', 'Pendiente']];
                
                resumen.forEach(r => { 
                    dataProgreso.addRow([r.proveedor, r.totalRecibido, r.totalPendiente]); 
                    dataTorta.push([r.proveedor, r.totalPendiente]); 
                });
                
                new google.visualization.BarChart(document.getElementById('chart-progreso')).draw(dataProgreso, { 
                    isStacked: true, 
                    colors: ['#10b981', '#f59e0b'], 
                    chartArea: {width: '60%', height: '70%'} 
                });
                
                new google.visualization.PieChart(document.getElementById('chart-distribucion')).draw(google.visualization.arrayToDataTable(dataTorta), { 
                    colors: ['#3b82f6', '#f59e0b', '#ef4444'], 
                    chartArea: {width: '80%', height: '80%'} 
                });
            } catch (chartError) {
                console.error("Error controlado al renderizar los componentes gráficos:", chartError);
            }
        }

        document.getElementById("form-proveedor").addEventListener("submit", function(e) {
            e.preventDefault();
            const inputs = document.querySelectorAll('.input-mercancia');
            const listaProductos = [];
            inputs.forEach(input => { if (input.value.trim() !== "") listaProductos.push(input.value.trim()); });

            enviar({
                accion: "registrar_proveedor",
                data: {
                    nombre: document.getElementById("prov-nombre").value,
                    productos: listaProductos.join(", ")
                }
            }, "form-proveedor");
            
            document.getElementById('contenedor-mercancias').innerHTML = `
                <div class="flex gap-2">
                    <input type="text" placeholder="Ej: Pasta Larga" class="input-mercancia w-full p-2 border rounded-lg" required>
                    <button type="button" onclick="agregarCampoMercancia()" class="bg-blue-600 text-white px-3 py-2 rounded-lg font-bold">+</button>
                </div>`;
        });

        document.getElementById("form-prepago").addEventListener("submit", function(e) {
            e.preventDefault();
            const cant = Number(document.getElementById("p-cantidad").value); 
            const costo = Number(document.getElementById("p-costo").value); 
            const tasa = Number(document.getElementById("p-tasa").value); 
            const usd = cant * costo;
            
            enviar({ 
                accion: "registrar_prepago", 
                data: { 
                    idLote: document.getElementById("p-id-lote").value, 
                    fechaPago: new Date().toLocaleDateString('es-ES'), 
                    proveedor: document.getElementById("p-proveedor").value, 
                    producto: document.getElementById("p-producto").value, 
                    cantidadPrepagada: cant, 
                    costoLotes: costo, 
                    montoUsd: usd, 
                    tasaCambio: tasa, 
                    montoBsPagado: usd * tasa, 
                    observaciones: "" 
                } 
            }, "form-prepago");
        });

        document.getElementById("form-despacho").addEventListener("submit", function(e) {
            e.preventDefault();
            const cant = Number(document.getElementById("d-cantidad").value); 
            const bs = Number(document.getElementById("d-monto-bs").value);
            
            enviar({ 
                accion: "registrar_despacho", 
                data: { 
                    idDespacho: "D-" + Date.now().toString().slice(-4), 
                    nroFacturaEntrega: document.getElementById("d-factura").value, 
                    fechaRecepcion: new Date().toLocaleDateString('es-ES'), 
                    proveedor: document.getElementById("d-proveedor").value, 
                    producto: document.getElementById("d-producto").value, 
                    cantidadRecibida: cant, 
                    tasaDiaRecepcion: cant > 0 ? (bs / (cant * 7.199)) : 0, 
                    montoBsRecibido: bs, 
                    ajusteMalEstado: 0 
                } 
            }, "form-despacho");
        });

        async function enviar(payload, formId) {
            try {
                await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                alert("¡Guardado con éxito!");
                document.getElementById(formId).reset();
                setTimeout(() => { cargarDatos(); }, 1000);
            } catch (error) { 
                alert("Error al enviar la transacción."); 
                console.error(error);
            }
        }

        // Función auxiliar por si cambias de módulo y necesitas re-dibujar los gráficos para que no salgan aplastados
        function cambiarModulo(idModulo) {
            document.querySelectorAll('.modulo').forEach(m => m.classList.add('hidden'));
            document.getElementById(idModulo).classList.remove('hidden');
            document.querySelectorAll('aside nav button').forEach(b => {
                b.className = "w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-slate-800 hover:text-white text-slate-300 transition";
            });
            
            const btnActivo = document.getElementById('nav-' + idModulo);
            if (idModulo === 'mod-dashboard') {
                btnActivo.className = "w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-bold bg-blue-600 text-white transition";
                // Forzar recarga de datos/gráficos al volver al Dashboard principal
                cargarDatos();
            } else if (idModulo === 'mod-recepcion') {
                btnActivo.className = "w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-bold bg-emerald-600 text-white transition";
            } else {
                btnActivo.className = "w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-bold bg-slate-700 text-white transition";
            }
            
            const titulos = { 'mod-dashboard': 'Dashboard General', 'mod-prepagos': 'Registrar Prepagos', 'mod-recepcion': 'Recepción de Carga', 'mod-proveedores': 'Ficha de Proveedores' };
            document.getElementById('titulo-modulo').innerText = titulos[idModulo];
        }
    </script>
